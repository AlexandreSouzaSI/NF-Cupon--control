services:
  postgres:
    image: postgres:15
    container_name: compras_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compras_db
    ports:
      - "5432:5432"
    volumes:
      - compras_postgres_data:/var/lib/postgresql/data

volumes:
  compras_postgres_data:
